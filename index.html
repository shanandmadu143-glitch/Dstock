<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Stock App</title>
    <!-- Excel ගොනු කියවීමට සහ ලිවීමට අවශ්‍ය SheetJS Library එක -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .upload-section { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #e9ecef; border-radius: 5px; margin-bottom: 20px; }
        input[type="file"], input[type="text"], input[type="number"] { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        input[type="file"] { width: auto; }
        .btn { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #218838; }
        .btn-download { background: #007bff; }
        .btn-download:hover { background: #0069d9; }
        .search-box { margin-bottom: 20px; }
        .result-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; display: none; }
        .result-list li { padding: 10px; border-bottom: 1px solid #ddd; cursor: pointer; background: #fafafa; }
        .result-list li:hover { background: #e2e6ea; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .edit-section { padding: 20px; border: 1px solid #b8daff; background: #cce5ff; border-radius: 5px; display: none; }
        #selectedItemName { margin-top: 0; color: #004085; }
    </style>
</head>
<body>

<div class="container">
    <h2>Daily Stock Management</h2>
    
    <div class="upload-section">
        <div>
            <label for="excelFile"><b>Upload Excel (.xlsx):</b></label><br>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
        </div>
        <button class="btn btn-download" id="downloadBtn" style="display: none;" onclick="downloadExcel()">Download Updated File</button>
    </div>

    <div class="search-box" id="searchSection" style="display: none;">
        <h3>Search Material</h3>
        <input type="text" id="searchInput" placeholder="Enter Material Code or Name..." onkeyup="searchItem()">
        <ul class="result-list" id="resultList"></ul>
    </div>

    <div class="edit-section" id="editSection">
        <h3 id="selectedItemName"></h3>
        <div class="form-grid">
            <div class="form-group">
                <label>E: Opening Stock</label>
                <input type="number" id="valE" readonly style="background: #e9ecef;">
            </div>
            <div class="form-group">
                <label>F: Receipt</label>
                <input type="number" id="valF" value="0">
            </div>
            <div class="form-group">
                <label>G: Issues</label>
                <input type="number" id="valG" value="0">
            </div>
            <div class="form-group">
                <label>H: Return</label>
                <input type="number" id="valH" value="0">
            </div>
            <div class="form-group">
                <label>I: Received to SSL</label>
                <input type="number" id="valI" value="0">
            </div>
            <div class="form-group">
                <label>J: Sent to SSL</label>
                <input type="number" id="valJ" value="0">
            </div>
        </div>
        <button class="btn" onclick="updateStock()">Update Total Closing Stock</button>
        <p id="successMessage" style="color: green; font-weight: bold; display: none; margin-top: 10px;">Stock Updated Successfully!</p>
    </div>
</div>

<script>
    let excelData = [];
    let selectedRowIndex = -1;
    let workbook = null;
    let worksheetName = "";

    // ගොනුව Upload කරන විට දත්ත කියවීම
    document.getElementById('excelFile').addEventListener('change', function(e) {
        let file = e.target.files[0];
        if(!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            let data = new Uint8Array(e.target.result);
            workbook = XLSX.read(data, {type: 'array'});
            worksheetName = workbook.SheetNames[0]; // පළමු sheet එක ලබාගැනීම
            let worksheet = workbook.Sheets[worksheetName];
            
            // "A" ලෙස දීමෙන් A, B, C ආදී column අකුරු වලින් දත්ත වෙන් කරගනී
            excelData = XLSX.utils.sheet_to_json(worksheet, {header: "A", defval: ""});
            
            document.getElementById('searchSection').style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'block';
            alert("File Uploaded Successfully! You can now search for items.");
        };
        reader.readAsArrayBuffer(file);
    });

    // Material Code හෝ Name එකෙන් Search කිරීම
    function searchItem() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let list = document.getElementById('resultList');
        list.innerHTML = "";

        if (input.trim() === "") {
            list.style.display = 'none';
            return;
        }

        let results = 0;
        // 0 වෙනි පේළිය (Headers) මඟහැර 1 සිට කියවීම
        for (let i = 1; i < excelData.length; i++) {
            let row = excelData[i];
            let code = (row["B"] || "").toString().toLowerCase();
            let name = (row["C"] || "").toString().toLowerCase();

            if (code.includes(input) || name.includes(input)) {
                let li = document.createElement("li");
                li.innerText = `${row["B"]} - ${row["C"]}`;
                li.onclick = function() { selectItem(i); };
                list.appendChild(li);
                results++;
            }
            if (results > 15) break; // වැඩිම ප්‍රතිඵල 15ක් පමණක් පෙන්වීමට
        }
        
        list.style.display = results > 0 ? 'block' : 'none';
    }

    // අදාල Item එක තේරූ පසු Edit ෆෝම් එකට දත්ත පිරවීම
    function selectItem(index) {
        selectedRowIndex = index;
        let row = excelData[index];
        
        document.getElementById('selectedItemName').innerText = `Editing: ${row["B"]} - ${row["C"]}`;
        document.getElementById('valE').value = parseFloat(row["E"]) || 0;
        document.getElementById('valF').value = parseFloat(row["F"]) || 0;
        document.getElementById('valG').value = parseFloat(row["G"]) || 0;
        document.getElementById('valH').value = parseFloat(row["H"]) || 0;
        document.getElementById('valI').value = parseFloat(row["I"]) || 0;
        document.getElementById('valJ
